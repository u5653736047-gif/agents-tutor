[project]
name = "backend"
version = "0.1.0"
description = "多智能体助教助学系统 - 基于 LangGraph 的智能体编排引擎"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "pydantic>=2.7.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]
embedding = [
    "fastembed>=0.8.0",
]
# PDF 表格结构化提取可选依赖组（S5-B1/B2）：附件链路与入库链路的
# PDF 表格转 Markdown。pdfplumber：纯 Python（pdfminer.six 系）、
# Windows pip 可装、无原生依赖；未安装时 API_PDF_TABLE_MODE=auto
# 自动回退 pypdf 纯文本，行为与现状逐项一致。
pdf-table = [
    "pdfplumber>=0.11",
]
# OCR 可选依赖组（六大功能计划 P0-6）：图片附件文本提取，
# 服务批改（手写作业照片）与答疑（手写公式照片）。
# rapidocr-onnxruntime：PP-OCR 同源模型、纯 pip 约 50MB、模型内置
# wheel 无需联网下载、Windows/CI 无 paddlepaddle 环境坑（选型理由
# 见 core/ocr.py 模块注释）；未安装时 API_OCR_MODE=auto 自动降级。
ocr = [
    "rapidocr-onnxruntime>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
