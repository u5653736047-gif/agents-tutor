[project]
name = "backend"
version = "0.1.0"
description = "多智能体助教助学系统 - 基于 LangGraph 的智能体编排引擎"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "pydantic>=2.7.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]
embedding = [
    "fastembed>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
